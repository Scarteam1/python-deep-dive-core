name: Python Code Linting Matrix

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        
    - name: Analysing Pure Scripts Only
      run: |
        # Explicit fix: Search ONLY for standalone .py production files 
        # and ignore complex experimental .ipynb notebook files completely.
        find . -name "*.py" -not -path "*/.*" | xargs -r pylint --disable=R,C
